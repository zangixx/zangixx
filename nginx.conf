user  nginx;
worker_processes  auto;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Identity / tokens -------------------------------------------------
    server_tokens off;                 # hide nginx version in errors/headers
    # To remove the "Server: nginx" header entirely you need the headers-more
    # module, then: more_clear_headers Server;  (not in the stock alpine image)

    # ---- Logging: none -----------------------------------------------------
    # Zero request logging. We keep only critical errors, and even those carry
    # no client IPs. This is the edge where IPs exist; we choose not to record.
    access_log off;
    error_log  /dev/stderr crit;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  30s;
    client_max_body_size 1m;           # app shell only — media rides the WebSocket

    # ---- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proto_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Brotli gives better ratios but needs an nginx built with ngx_brotli
    # (the stock image does NOT include it). Use a brotli-enabled image, then
    # uncomment:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ---- Rate limiting at the edge ----------------------------------------
    # nginx necessarily sees the real client IP (it terminates TLS). We use it
    # ONLY here, in memory, for abuse control — then strip it before proxying.
    limit_req_zone  $binary_remote_addr zone=req:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream zangi {
        server zangi:8080;
        keepalive 32;
    }

    # ---- HTTP: redirect everything to HTTPS -------------------------------
    server {
        listen      80;
        listen [::]:80;
        server_name _;
        location / { return 301 https://$host$request_uri; }
    }

    # ---- HTTPS: TLS 1.3, reverse proxy ------------------------------------
    server {
        listen      443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.3;          # 1.3 only; add TLSv1.2 for broader reach
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 10m;
        ssl_session_tickets off;              # avoid ticket-key based FS weakening

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # Same policy as the in-page <meta>; 'wasm-unsafe-eval' is for libsodium's WASM.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

        limit_conn conn 20;

        # Static app shell served directly (public/ mounted read-only).
        root  /usr/share/nginx/html;
        index index.html;

        # Liveness probe (aggregate only, no user data). Restrict if you prefer.
        location = /health {
            proxy_pass http://zangi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP 0.0.0.0;
            proxy_set_header X-Forwarded-For 0.0.0.0;
        }

        # Aggregate metrics. The app itself requires the X-Stats-Secret header
        # and returns 404 otherwise; keep that secret out of the client.
        location = /stats {
            proxy_pass http://zangi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP 0.0.0.0;
            proxy_set_header X-Forwarded-For 0.0.0.0;
            proxy_pass_header X-Stats-Secret;
        }

        # WebSocket relay.
        location = /ws {
            limit_req zone=req burst=40 nodelay;

            proxy_pass         http://zangi;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;

            # ---- IP & fingerprint masking toward the upstream app ----------
            # The relay has no need for the client's IP, UA, Referer or cookies,
            # and we never want it able to log them. Overwrite with constants
            # so the upstream literally cannot see the originating client.
            proxy_set_header   X-Real-IP       0.0.0.0;
            proxy_set_header   X-Forwarded-For 0.0.0.0;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   User-Agent  "";
            proxy_set_header   Referer     "";
            proxy_set_header   Cookie      "";

            proxy_read_timeout 1h;             # long-lived sockets
            proxy_send_timeout 1h;
            proxy_buffering    off;
        }

        # The vendored, SRI-pinned crypto lib never changes under this name —
        # cache it hard (the service worker also caches it client-side).
        location = /libs/sodium.js {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
